name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.2"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q
  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t string-art-studio:ci .
      - name: The image starts, answers its health check and serves the app
        run: |
          docker run -d --name studio -p 127.0.0.1:8050:8050 string-art-studio:ci
          for _ in $(seq 1 30); do
            if curl -fsS -m 3 http://127.0.0.1:8050/healthz; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8050/healthz | grep -q '"ok": *true'
          curl -fsS http://127.0.0.1:8050/ | grep -q 'String Art Studio'
          docker run --rm string-art-studio:ci string-art-studio generate --help >/dev/null
          docker rm -f studio
