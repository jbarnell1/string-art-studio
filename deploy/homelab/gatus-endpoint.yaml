# Example endpoints for a Gatus monitor (https://gatus.io) running on the same host: paste them
# under `endpoints:` in your Gatus config. The container answers on loopback.
  - name: String Art Studio
    url: "http://127.0.0.1:8050/healthz"
    interval: 5m
    conditions: ["[STATUS] == 200", "[BODY].ok == true"]
# The Piper voice container is not published on the host; Studio reports it through /api/voice.
  - name: String Art voice
    url: "http://127.0.0.1:8050/api/voice"
    interval: 5m
    conditions: ["[STATUS] == 200", "[BODY].available == true"]
