<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>String Art Studio</title>
<base href="__BASE__/">
<meta name="theme-color" content="#f1f1ef">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="String Art">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="static/icons/favicon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="static/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/app.css?v=__VERSION__">
</head>
<body>
<div class="frame">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/">
      <img src="static/icons/icon-192.png" alt="" width="36" height="36">
      <span>String Art Studio</span>
    </a>
    <nav class="nav" id="nav" aria-label="Main">
      <a href="#/" data-nav="library">Library</a>
      <a href="#" data-nav="studio" class="hidden">Settings and preview</a>
      <a href="#" data-nav="compare" class="hidden">Results</a>
      <a href="#" data-nav="build" class="hidden">Build mode</a>
    </nav>
    <div class="sidebar-foot">
      <span id="health" class="muted">Connecting</span>
      <span class="muted">v__VERSION__</span>
    </div>
  </aside>
  <header class="topbar">
    <button class="menu-button" id="menuButton" aria-label="Menu" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 4.5h14M2 9h14M2 13.5h14"/></svg>
    </button>
    <div class="topbar-title" id="topTitle">Library</div>
    <div class="topbar-actions" id="topActions"></div>
  </header>
  <main class="sheet" id="sheet" tabindex="-1"></main>
  <div class="scrim hidden" id="scrim"></div>
</div>
<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="filePicker" accept="image/*,.heic,.heif" class="hidden">
<input type="file" id="bundlePicker" accept=".zip,application/zip" class="hidden">
<input type="file" id="musicPicker" accept="audio/*" class="hidden">
<script>window.SAS_BASE = "__BASE__"; window.SAS_VERSION = "__VERSION__";</script>
<script src="static/app.js?v=__VERSION__" defer></script>
</body>
</html>
